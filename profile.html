
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <div class="notification-popup" id="notification-popup">
        <i class="bx bx-bell"></i>

        <div class="notification-popup-content">
            <div class="notification-popup-title" id="notification-title">
                QueueSmart
            </div>

            <div class="notification-popup-message" id="notification-message">
                Your profile has been updated.
            </div>
        </div>
    </div>
    <div class="dashboard-container">
        <div class="dashboard-wrapper">

            <h1>Your Queue<span>Smart</span> Account</h1>

            <a href="/dashboard.html" class="btn small-btn" id="profile-back-btn">
                <i class="bx bx-arrow-back"></i> Go Back
            </a>

            <div class="glass-card">
                <h3>Edit Profile</h3>

                <form id="profile-form">
                    <label for="full-name">Full Name</label>
                    <input type="text" id="full-name" required maxlength="100">

                    <label for="email">Email</label>
                    <input type="email" id="email" disabled>

                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" pattern="[0-9]{10}" maxlength="10" minlength="10" placeholder="Enter 10-digit phone number">

                    <button type="submit" class="btn">Save Changes</button>
                </form>

                <p id="profile-message" role="status"></p>
            </div>

        </div>
    </div>

<script>
    const notifySound = new Audio("notification.mp3");

    async function loadProfile() {
        const token = sessionStorage.getItem("token");

        if (!token) {
            window.location.replace("/Login.html");
            return;
        }

        try {
            const response = await fetch("/api/profile", {
                headers: {
                    Authorization: `Bearer ${token}`
                }
            });

            if (!response.ok) {
                throw new Error("Unable to load profile.");
            }

            const data = await response.json();
            const profile = data.profile;

            document.getElementById("full-name").value = profile.full_name;
            document.getElementById("email").value = profile.email;
            document.getElementById("phone").value = profile.phone || "";

        } catch (error) {
            console.error("Error loading profile:", error);
            document.getElementById("profile-message").textContent =
                "Unable to load profile.";
        }
    }

    document.getElementById("profile-form").addEventListener("submit", async function(event) {
        event.preventDefault();

        const token = sessionStorage.getItem("token");

        const full_name = document.getElementById("full-name").value;
        const phone = document.getElementById("phone").value;

        try {
            const response = await fetch("/api/profile", {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    Authorization: `Bearer ${token}`
                },
                body: JSON.stringify({
                    full_name,
                    phone,
                })
            });

            const data = await response.json();

            if (response.ok) {
                showNotification("Profile Update", "Your settings have been saved");
            } else {
                showNotification("Update Failed", data.message || "Unable to update profile.");
            }

        } catch (error) {
            console.error("Error updating profile:", error);
            document.getElementById("profile-message").textContent =
                "Unable to update profile.";
        }
    });

    loadProfile();

    function showNotification(title, message) {
        const popup = document.getElementById("notification-popup");

        document.getElementById("notification-title").textContent = title;
        document.getElementById("notification-message").textContent = message;

        popup.classList.add("show");

        // Play notification sound
        notifySound.currentTime = 0;
        notifySound.play().catch(error => {
            console.warn("Notification sound could not play:", error);
        });

        setTimeout(function() {
            popup.classList.remove("show");
        }, 4000);
    }
</script>

</body>
</html>
